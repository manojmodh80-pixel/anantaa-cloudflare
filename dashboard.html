<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anantaa Admin Dashboard</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f1ee;margin:0;padding:20px;color:#3b1118}
.box{max-width:650px;margin:auto;background:white;padding:24px;border-radius:18px;box-shadow:0 5px 25px #0002}
h1{margin-top:0}
label{display:block;font-weight:bold;margin-top:18px}
input,textarea{width:100%;box-sizing:border-box;padding:12px;margin-top:7px;border:1px solid #ccc;border-radius:9px;font-size:15px}
button{margin-top:20px;padding:13px 22px;border:0;border-radius:10px;background:#721526;color:white;font-weight:bold;cursor:pointer}
#preview{display:block;max-width:180px;max-height:180px;margin:15px auto;border-radius:12px;object-fit:contain}
.status{margin-top:15px;padding:12px;border-radius:8px;background:#f3e6e8}
</style>
</head>

<body>
<div class="box">

<h1>ANANTAA Admin Dashboard</h1>
<p>Update your website information.</p>

<label>Logo</label>
<input type="file" id="logoFile" accept="image/png,image/jpeg,image/webp">
<img id="preview" src="/anantaa-logo.png" alt="Logo Preview">

<label>Website Name</label>
<input id="siteName">

<label>Google Review URL</label>
<input id="reviewUrl">

<label>Instagram URL</label>
<input id="instagramUrl">

<label>Facebook URL</label>
<input id="facebookUrl">

<label>UPI ID</label>
<input id="upiId">

<label>Google Maps URL</label>
<input id="mapsUrl">

<label>WhatsApp URL</label>
<input id="whatsappUrl">

<label>Phone Number</label>
<input id="phoneNumber">

<label>Address</label>
<textarea id="address" rows="3"></textarea>

<button id="loadBtn">LOAD CURRENT DATA</button>
<button id="saveBtn">SAVE CHANGES</button>

<div class="status" id="status">Ready.</div>

</div>

<script>
let data = null;
let logoData = "";

const password = prompt("Enter Admin Password:");

function el(id){
  return document.getElementById(id);
}

async function loadData(){
  try{
    const res = await fetch("/api/config",{cache:"no-store"});
    if(!res.ok) throw new Error("Could not load configuration");

    data = await res.json();

    el("siteName").value = data.siteName || "";
    el("reviewUrl").value = data.review?.url || "";
    el("instagramUrl").value = data.instagram?.url || "";
    el("facebookUrl").value = data.facebook?.url || "";
    el("upiId").value = data.payment?.upiId || "";
    el("mapsUrl").value = data.maps?.url || "";
    el("whatsappUrl").value = data.whatsapp?.url || "";
    el("phoneNumber").value = data.phone?.number || "";
    el("address").value = data.footer?.address || "";

    if(data.logo?.url){
      logoData = data.logo.url;
      el("preview").src = logoData;
    }

    el("status").textContent = "Current data loaded ✓";
  }catch(e){
    el("status").textContent = "Error: "+e.message;
  }
}

el("logoFile").addEventListener("change",function(){
  const file=this.files[0];
  if(!file) return;

  const reader=new FileReader();

  reader.onload=function(){
    logoData=reader.result;
    el("preview").src=logoData;
  };

  reader.readAsDataURL(file);
});

async function saveData(){

  if(!data){
    alert("Please load current data first.");
    return;
  }

  data.siteName=el("siteName").value;

  data.review=data.review || {};
  data.review.url=el("reviewUrl").value;

  data.instagram=data.instagram || {};
  data.instagram.url=el("instagramUrl").value;

  data.facebook=data.facebook || {};
  data.facebook.url=el("facebookUrl").value;

  data.payment=data.payment || {};
  data.payment.upiId=el("upiId").value;

  data.maps=data.maps || {};
  data.maps.url=el("mapsUrl").value;

  data.whatsapp=data.whatsapp || {};
  data.whatsapp.url=el("whatsappUrl").value;

  data.phone=data.phone || {};
  data.phone.number=el("phoneNumber").value;

  data.footer=data.footer || {};
  data.footer.address=el("address").value;

  if(logoData){
    data.logo={url:logoData};
  }

  try{
    const res=await fetch("/api/config",{
      method:"PUT",
      headers:{
        "Content-Type":"application/json",
        "X-Admin-Password":password
      },
      body:JSON.stringify(data)
    });

    if(!res.ok){
      const text=await res.text();
      throw new Error(text || "Save failed");
    }

    el("status").textContent="Saved successfully ✓";
    alert("Anantaa website updated successfully!");
  }catch(e){
    el("status").textContent="Error: "+e.message;
    alert("Save failed: "+e.message);
  }
}

el("loadBtn").onclick=loadData;
el("saveBtn").onclick=saveData;

loadData();
</script>

</body>
</html>
