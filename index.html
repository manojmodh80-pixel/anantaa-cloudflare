<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#5b0716"><title>ANANTAA CREATION | Endless Tradition</title><link rel="stylesheet" href="/style.css"></head><body><main class="page"><div class="fabric fabric-top"></div><div class="ornament ornament-top">✦</div><header class="header"><img src="/anantaa-logo.png" class="logo" alt="Anantaa Creation"><p class="eyebrow" id="eyebrow"></p><p class="subline" id="subline"></p></header><section class="actions" id="actions"></section><section class="review-card" id="reviewHelper"></section><footer><div class="footer-rule">✦</div><p><strong id="footerName"></strong></p><p id="footerAddress"></p><p class="footer-links" id="footerLinks"></p></footer><div class="fabric fabric-bottom"></div></main>
<div class="modal" id="paymentModal" aria-hidden="true"><div class="modal-box"><button class="close" data-close="paymentModal">×</button><h2>PAY ANANTAA CREATION</h2><p>UPI ID</p><div class="upi-box" id="upiText"></div><button class="primary" id="upiBtn">OPEN UPI PAYMENT</button><p class="note">If the UPI app does not open, copy the UPI ID and pay from your preferred UPI app.</p></div></div>
<div class="modal" id="reviewModal" aria-hidden="true"><div class="modal-box review-modal"><button class="close" data-close="reviewModal">×</button><h2>CREATE YOUR REVIEW DRAFT</h2><p class="note">Use only details that are true about your own shopping experience.</p><label>What did you like?</label><div class="chips" id="chips"><button data-value="the collection">Collection</button><button data-value="the saree quality">Saree Quality</button><button data-value="the Chaniya Choli collection">Chaniya Choli</button><button data-value="the Indo-Western collection">Indo-Western</button><button data-value="the staff and service">Staff & Service</button><button data-value="the pricing">Pricing</button></div><label>Your own words</label><textarea id="reviewWords" rows="4" placeholder="Example: Beautiful collection, helpful staff and good shopping experience."></textarea><label>Rating</label><select id="rating"><option value="5">★★★★★ 5 stars</option><option value="4">★★★★ 4 stars</option><option value="3">★★★ 3 stars</option><option value="2">★★ 2 stars</option><option value="1">★ 1 star</option></select><button class="primary" id="draftBtn">GENERATE REVIEW DRAFT</button><div id="draftArea" class="draft-area" hidden><label>Your draft</label><textarea id="draftText" rows="6" readonly></textarea><div class="draft-actions"><button class="secondary" id="copyBtn">COPY</button><a class="primary link-button" id="reviewOpenBtn" target="_blank">OPEN GOOGLE REVIEW</a></div></div></div></div><script src="/script.js"></script></body></html>
